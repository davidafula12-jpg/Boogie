<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huncho Dreams Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SIGN IN / CREATE ACCOUNT -->
  <section id="auth" class="auth">
    <div class="authbox">
      <div class="spines" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <h1>Huncho Dreams Library</h1>
      <p id="authTitle" class="muted">Sign in to borrow books.</p>
      <form id="authForm">
        <label>Username <input id="u" required autocomplete="username"></label>
        <label>Password <input id="p" type="password" required autocomplete="current-password"></label>
        <p id="authErr" class="err" role="alert"></p>
        <button class="primary" type="submit" id="authBtn">Sign in</button>
      </form>
      <button class="link" id="authSwitch" type="button">New here? Create an account</button>
      <p class="muted small">Demo logins: admin / admin123, or user / user123</p>
    </div>
  </section>

  <!-- THE LIBRARY (shown after login) -->
  <div id="app" hidden>
    <header class="top">
      <h1>Huncho Dreams Library</h1>
      <nav aria-label="Main">
        <button data-view="catalog" class="on">Catalog</button>
        <button data-view="loans" data-member>My loans <span id="loanCount">0</span></button>
        <button data-view="all" data-admin>All loans</button>
        <button data-view="add" data-admin>Add a book</button>
      </nav>
      <div class="who"><span id="who"></span> <button id="logout" class="ghost light">Log out</button></div>
    </header>

    <main>
      <section id="catalog" class="view">
        <div class="tools">
          <input id="q" type="search" placeholder="Search by title or author" aria-label="Search books">
          <select id="genre" aria-label="Genre"></select>
          <label class="check"><input type="checkbox" id="onlyAvail"> Available now</label>
        </div>
        <p id="count" class="muted"></p>
        <ul id="list" class="shelf"></ul>
      </section>

      <section id="loans" class="view" hidden>
        <ul id="loanList" class="shelf"></ul>
      </section>

      <section id="all" class="view" hidden>
        <ul id="allList" class="shelf"></ul>
      </section>

      <section id="add" class="view" hidden>
        <form id="addForm" class="addform">
          <label>Title <input name="title" required></label>
          <label>Author <input name="author" required></label>
          <label>Genre <select name="genre"></select></label>
          <label>Year <input name="year" type="number" min="1" max="2100" required></label>
          <label>Copies <input name="copies" type="number" min="1" value="1" required></label>
          <button type="submit" class="primary">Add to catalog</button>
        </form>
      </section>
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
